name: Wispad
options:
  bundleIdPrefix: com.yatofix
  developmentLanguage: fr
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Wispad:
    path: .
targets:
  Wispad:
    type: application
    platform: macOS
    productName: Wispad
    sources:
      - path: Sources/Wispad
    # Signature : Signing.xcconfig (locale par défaut), complété par Signing.local.xcconfig s'il existe.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Wispad
        product: WispadCore
    postBuildScripts:
      # Commit de la version, lu par la barre latérale (BuildStatus) ; avant la signature de l'app.
      - name: Commit de la version
        script: "\"$SRCROOT/scripts/build-commit.sh\""
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yatofix.wispad
        PRODUCT_NAME: Wispad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Wispad/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Wispad/Wispad.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # scripts/build-commit.sh lit le dépôt git (hors des fichiers déclarés de la phase).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  Wispad:
    build:
      targets:
        Wispad: all
    run:
      config: Debug
